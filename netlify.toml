# Netlify hosting for studio a.c.e (free plan). Netlify detects Next.js and adds its runtime automatically.
[build]
  command = "npm run build"
  publish = ".next"
  # Skip deploys for photo-only commits (see the script): saves the free plan's monthly deploys.
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
